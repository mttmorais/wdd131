<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Images</title>

    <meta name="description" content="Page with an album testing the lazy loading img">
    <meta name="author" content="Matheus Morais">

    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <main>
        <h1>Loading Image</h1>
        <picture>
            <img src="images/bountiful-temple.webp" alt="Bountiful Temple" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="images/brasilia-brazil-temple.webp" alt="Brasília Brazil Temple" loading="lazy" width="400"
                height="600">
        </picture>
        <picture>
            <img src="images/brigham-city-utah-temple.webp" alt="Brigham City Utah Temple" loading="lazy" width="400"
                height="600">
        </picture>
        <picture>
            <img src="images/california-temple.webp" alt="San Diego California Temple" loading="lazy" width="400"
                height="600">
        </picture>
        <picture>
            <img src="images/sao-paulo-brazil-temple.webp" alt="São Paulo Brazil Temple" loading="lazy" width="400"
                height="600">
        </picture>
        <picture>
            <img src="images/spokane-washington-temple.webp" alt="Spokane Washington Temple" loading="lazy" width="400"
                height="600">
        </picture>
    </main>

    <footer>
        <p>©<span id="currentyear"></span> | Matheus Morais | Brazil</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
